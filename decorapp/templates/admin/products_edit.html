<!-- edit product -->

{% extends "admin/admin_index.html" %}

{% block content %}
    <div class="container mt-4">
        <h1>Admin - {{ action }} Product</h1>
        
        <!-- Display messages (if any) -->
        {% if messages %}
            <div class="alert alert-info">
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
        
        <!-- Add or Edit Product Form -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Product Name -->
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" name="name" id="name" class="form-control" value="{{ product.name }}" required>
            </div>
            
            <!-- Product Description -->
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" class="form-control" required>{{ product.description }}</textarea>
            </div>
            
            <!-- Product Price -->
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" name="price" id="price" class="form-control" value="{{ product.price }}" required step="0.01">
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" name="stock" id="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
                <!-- Product Delivery Date -->
            <div class="form-group">
                <label for="delivery_date">Delivery Date</label>
                <input type="date" name="delivery_date" id="delivery_date" class="form-control"
                    value="{{ product.delivery_date|date:'Y-m-d' }}">   
            </div>
            <!-- Product Image -->
            <div class="form-group">
                <label for="image">Product Image</label>
                <input type="file" name="image" id="image" class="form-control">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="Product Image" width="100" />
                {% endif %}
            </div>

            <button type="submit" class="btn btn-primary">{{ action }} Product</button>
        </form>
    </div>

    <!-- Optional JavaScript -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% endblock %}
