{% extends "admin/admin_index.html" %}

{% block content %}
    <div class="container mt-4">
        <h1>Admin - Category List</h1>
        <a href="{% url 'admin_add_category' %}" class="btn btn-primary mb-3">Add New Category</a>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                <tr>
                    <td>{{ category.id }}</td>
                    <td>{{ category.category }}</td>
                    <td>
                        <a href="{% url 'admin_edit_category' category.id %}" class="btn btn-warning btn-sm">Edit</a>
                        <a href="{% url 'admin_delete_category' category.id %}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">No categories available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endblock %}
