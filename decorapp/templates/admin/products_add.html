{% extends "admin/admin_index.html" %}

{% block content %}
    <div class="container mt-4">
        <h1>Admin - {{ action }} Product</h1>

        <!-- Display messages -->
        {% if messages %}
        <div class="alert alert-info">
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <!-- Add or Edit Product Form -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Product Name -->
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" name="name" id="name" class="form-control" value="{{ form.name }}" required>
            </div>

            <!-- Product Description -->
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" class="form-control"
                    required>{{ form.description }}</textarea>
            </div>

            <!-- Product Price -->
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" name="price" id="price" class="form-control" value="{{ form.price }}" required
                    step="0.01">
            </div>
            <!-- Product Stock -->
            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" name="stock" id="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
            <!-- Product Delivery Date -->
            <div class="form-group">
                <label for="delivery_date">Delivery Date</label>
                <input type="date" name="delivery_date" id="delivery_date" class="form-control"
                    value="{{ product.delivery_date|date:'Y-m-d' }}">   
            </div>

            <!-- Product Image -->
            <div class="form-group">
                <label for="image">Product Image</label>
                <input type="file" name="image" id="image" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">{{ action }} Product</button>

        </form>
    </div>

    {% endblock %}
