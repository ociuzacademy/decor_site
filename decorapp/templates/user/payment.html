{% extends 'user/user_index.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
      <!-- Header -->
      <div class="text-center mb-4">
        <h1 class="display-5 font-weight-bold mb-2">Payment</h1>
        <p class="text-muted mb-0">Order #{{ order.id }} — Complete your payment below.</p>
      </div>

      <div class="card shadow-sm border-0 rounded-lg overflow-hidden">
        <div class="card-body p-4 p-lg-5">
          <form method="POST">
            {% csrf_token %}

            <!-- Payment method -->
            <div class="form-group">
              <label for="payment_method" class="font-weight-bold">Payment method</label>
              <select name="payment_method" id="payment_method" class="form-control form-control-lg" required>
                <option value="COD">Cash on Delivery (COD)</option>
                <option value="CARD">Card payment</option>
              </select>
            </div>

            <!-- Card details (shown when CARD selected) -->
            <div id="card_details" class="border rounded p-3 bg-light mt-3" style="display: none;">
              <h6 class="font-weight-bold mb-3">Card details</h6>
              <div class="form-row">
                <div class="form-group col-12">
                  <label for="card_number">Card number</label>
                  <input type="text" name="card_number" id="card_number" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19">
                </div>
                <div class="form-group col-12">
                  <label for="cardholder_name">Cardholder name</label>
                  <input type="text" name="cardholder_name" id="cardholder_name" class="form-control" placeholder="Name on card">
                </div>
                <div class="form-row col-12">
                  <div class="form-group col-6">
                    <label for="expiry_date">Expiry (MM/YY)</label>
                    <input type="text" name="expiry_date" id="expiry_date" class="form-control" placeholder="MM/YY">
                  </div>
                  <div class="form-group col-6">
                    <label for="cvv">CVV</label>
                    <input type="text" name="cvv" id="cvv" class="form-control" placeholder="123">
                  </div>
                </div>
              </div>
            </div>

            <hr class="my-4">

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
              <a href="{% url 'view_cart' %}" class="btn btn-outline-secondary">Back to cart</a>
              <button type="submit" class="btn btn-success btn-lg px-4">Proceed with payment</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('payment_method').addEventListener('change', function() {
    var cardDetails = document.getElementById('card_details');
    var cardInputs = cardDetails.querySelectorAll('input');
    if (this.value === 'CARD') {
      cardDetails.style.display = 'block';
      cardInputs.forEach(function(inp) { inp.setAttribute('required', 'required'); });
    } else {
      cardDetails.style.display = 'none';
      cardInputs.forEach(function(inp) { inp.removeAttribute('required'); });
    }
  });
</script>
{% endblock %}
