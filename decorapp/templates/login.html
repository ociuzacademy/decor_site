{% extends "index.html" %}

{% block content %}
<div class="login-container">
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>
        </div>
        <label for="password">Password</label>
        <div class="password-wrapper">
            <input type="password" name="password" id="passwordField" required>
            <span class="toggle-password" onclick="togglePassword()">Show</span>
        </div>
        <div>
            <button type="submit">Login</button>
        </div>
    </form>

    {% if messages %}
    <div class="messages">
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>

<style>
    /* Centering the content */
    .login-container {
        width: 350px;
        margin: 50px auto;
        padding: 30px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    label {
        display: block;
        text-align: left;
        font-size: 14px;
        color: #555;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: black;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: black;
    }

    .messages ul {
        list-style-type: none;
        padding: 0;
        color: red;
        font-size: 14px;
        text-align: center;
    }

    .messages li {
        margin-bottom: 10px;
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        width: 100%;
        padding-right: 60px;
    }

    .toggle-password {
        position: absolute;
        right: 10px;
        top: 10px;
        cursor: pointer;
        font-size: 14px;
        color: #000;
    }
</style>
<script>
    function togglePassword() {
        var passwordField = document.getElementById("passwordField");
        var toggleText = document.querySelector(".toggle-password");
    
        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleText.textContent = "Hide";
        } else {
            passwordField.type = "password";
            toggleText.textContent = "Show";
        }
    }
    </script>
{% endblock %}
